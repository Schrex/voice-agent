# Render Blueprint for the staging backend (docs/staging.md). Prod gets its own service later.
# Secrets are `sync: false`: Render asks for them when the Blueprint is applied; never commit values.
services:
  - type: web
    name: voice-agent-staging
    runtime: python
    rootDir: backend
    # FREE FOR THE PROTOTYPE WEEK (product owner, 2026-11-02). A free instance sleeps after ~15 min
    # idle and takes 30-60 s to wake: the call-start webhook times out (the call fails) and the
    # Overdue sweep and 17:00 email don't run while it sleeps. An uptime ping on /healthz every
    # 5 min keeps it awake. Before any Foreman calls in (#37), set `plan: starter` and restore the
    # preDeployCommand below (docs/staging.md "Free plan").
    plan: free
    region: virginia
    numInstances: 1
    # Deploys come from .github/workflows/deploy-staging.yml after CI passes on main, not on every push.
    autoDeploy: false
    # Builds the dashboard too (served by the backend at /); the repo is checked out whole, so
    # ../frontend is reachable from rootDir. VITE_* vars are read at build time.
    buildCommand: (cd ../frontend && npm ci && npm run build && npm run check-bundle) && pip install uv==0.11.32 && uv sync --locked --no-dev
    # Free instances have no pre-deploy step, so migrations run at start. On Starter, move
    # `alembic upgrade head` back to `preDeployCommand:` so a failed migration never goes live.
    startCommand: .venv/bin/alembic upgrade head && exec .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      # The build also runs npm for the dashboard; same major version as CI.
      - key: NODE_VERSION
        value: "22"
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: HOOK_SECRET
        sync: false
      - key: TOOL_SECRET
        sync: false
      - key: ELEVENLABS_WEBHOOK_SECRET
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: OFFICE_MAIN_NUMBER
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # Alert SMS (Twilio) and the 17:00 email (Postmark). Leave empty until the account is
      # ready: each alert is then recorded as failed on the dashboard, nothing breaks.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_E164
        sync: false
      - key: POSTMARK_SERVER_TOKEN
        sync: false
      - key: POSTMARK_FROM
        sync: false
