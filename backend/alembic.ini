# Alembic config. Run from backend/: `uv run alembic upgrade head` (uses DATABASE_URL).
[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is taken from DATABASE_URL in env.py unless set programmatically.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
