name: Deploy staging

# Runs after CI passes on a push to main (i.e. a merge), and on demand.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      # Repository/environment settings (docs/staging.md); never commit their values.
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_STAGING_SERVICE_ID }}
      STAGING_URL: ${{ vars.STAGING_URL }}
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check configuration
        run: |
          for name in RENDER_API_KEY RENDER_SERVICE_ID STAGING_URL; do
            if [ -z "${!name}" ]; then echo "::error::$name is not configured (docs/staging.md)"; exit 1; fi
          done

      - name: Trigger Render deploy of ${{ env.COMMIT }}
        id: trigger
        run: |
          response=$(curl -fsS -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" -H "Content-Type: application/json" \
            -d "{\"commitId\": \"$COMMIT\", \"clearCache\": \"do_not_clear\"}")
          deploy_id=$(echo "$response" | jq -r '.id')
          echo "Render deploy $deploy_id"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy to go live
        env:
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          for _ in $(seq 1 100); do
            status=$(curl -fsS "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json" | jq -r '.status')
            echo "status: $status"
            case "$status" in
              live) exit 0 ;;
              *_failed|canceled|deactivated) echo "::error::Render deploy $DEPLOY_ID ended $status"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Render deploy $DEPLOY_ID not live after 25 min"; exit 1

      - name: Smoke-test /healthz
        run: |
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$STAGING_URL/healthz" | tee /dev/stderr \
            | jq -e '.status == "ok" and .db == "ok"'
